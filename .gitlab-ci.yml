# self.language-eval CI — test, then yard-native image build, then mirror sync.
# kaniko on bigbuild -> container.home (same pattern as self.ai / self.chat).
# CPU-only: the harness runs benchmarks by calling each model's OpenAI-compatible
# API, it doesn't run models locally. Builds the FastAPI control plane + the
# vendored language-eval framework into one image (api/main.py on :8096).

stages: [test, build, publish]

include:
  - project: 'selfshipyard/selfai/self.ai'
    ref: main
    file: '.gitlab/ci-templates/sync-public-alpha.yml'

default:
  tags: [bigbuild]

variables:
  IMAGE: $CI_REGISTRY_IMAGE

test:language-eval:
  stage: test
  image: python:3.11-slim
  timeout: 30m
  before_script:
    - pip install --no-cache-dir -e ".[api,ifeval,math,multilingual]" pytest
  script:
    # Same install footprint as the production image (Dockerfile): no
    # hf/torch, vllm, sglang, or optimum extras. Skip the suites that only
    # exercise those optional model backends — they need deps the shipped
    # image never installs, so they can't run here (see the
    # "[from sweep]" CI-coverage issue for the tracked gap).
    - >
      pytest tests/ -q
      --ignore=tests/models
      --ignore=tests/test_requests_caching.py
      --ignore=tests/test_utils.py
      --ignore=tests/test_evaluator.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Non-blocking second pass: covers the torch/tokenizers/optimum-backed test
# coverage the job above skips (see issue #1, "[from sweep] CI test stage
# skips torch/tokenizers/optimum-backed test coverage"). Installs the `hf`
# extra (torch, transformers, accelerate, peft — see language_eval/models/
# huggingface.py imports) plus `optimum` (optimum[openvino], needed because
# tests/models/test_openvino.py imports optimum.intel unconditionally at
# module level, so it can't even collect without it).
#
# All exercised tests already use small real HF models/tokenizers that are
# referenced elsewhere in this suite (EleutherAI/pythia-14m, -14m-deduped,
# -70m, -160m; facebook/opt-125m; hf-internal-testing/tiny-random-gpt2 and
# -tiny-random-t5; tokenizer-only allenai/OLMo-3-7B-Instruct) rather than
# mocks — none of these files have a mock-model mode. That means this job
# adds real network (model/tokenizer downloads from the HF Hub) and CPU
# inference time on top of the main job; allow_failure covers that cost
# being un-vetted so far.
test:hf-backends:
  stage: test
  image: python:3.11-slim
  timeout: 45m
  before_script:
    - pip install --no-cache-dir -e ".[hf,optimum]" pytest
  script:
    - >
      pytest -q
      tests/models/test_huggingface.py
      tests/models/test_bos_handling.py
      tests/models/test_hf_steered.py
      tests/models/test_openvino.py
      tests/models/test_sglang.py
      tests/test_requests_caching.py
      tests/test_utils.py
      tests/test_evaluator.py
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build:language-eval:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  timeout: 1h
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_JOB_TOKEN" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile Dockerfile
      --cache=true --cache-repo "$IMAGE/cache"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$IMAGE:latest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- publish: mirror main -> public-alpha (GitLab + GitHub), scheduled only -
sync:public-alpha:
  extends: .sync-public-alpha
  variables:
    MIRROR_EXCLUDE_PATHS: ""
